# docker-compose for Cinema microservices (Showtimes, MovieCatalog, Booking)
# Run: docker compose up --build
# Stop: docker compose down

version: "3.8"

services:
  moviecatalog:
    build:
      context: ./services/catalog-service
      dockerfile: DockerFile
    image: cinema.moviecatalog:latest
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  showtimes:
    build:
      context: ./services/showtimes-service
      dockerfile: Dockerfile
    image: cinema.showtimes:latest
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped
    depends_on:
      - moviecatalog
      - booking

  booking:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    image: cinema.booking:latest
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

# Notes:
# - Ports map container port 80 to host ports 5001/5002/5003 respectively.
# - Change `ASPNETCORE_ENVIRONMENT` to `Production` for production runs.
# - To run a single service: `docker compose up --build showtimes`